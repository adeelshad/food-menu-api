$kind: http-request
url: http://localhost:3001/api/food-items
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Mango Lassi",
      "category": "Beverage",
      "price": 250
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("TC02: status code is 201", function () { pm.response.to.have.status(201); });
      pm.test("TC02: response is JSON", function () { pm.response.to.be.json; });
      pm.test("TC02: default preparationTime 10 and isAvailable true", function () { const body = pm.response.json(); pm.expect(body.preparationTime).to.eql(10); pm.expect(body.isAvailable).to.eql(true); });
    language: text/javascript
order: 2000
