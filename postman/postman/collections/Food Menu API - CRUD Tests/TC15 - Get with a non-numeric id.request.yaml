$kind: http-request
url: http://localhost:3001/api/food-items/abc
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("TC15: status code is 400", function () { pm.response.to.have.status(400); });
      pm.test("TC15: response is JSON", function () { pm.response.to.be.json; });
      pm.test("TC15: Invalid id error returned", function () { const body = pm.response.json(); pm.expect(body.error).to.eql('Invalid id'); });
    language: text/javascript
order: 15000
