$kind: http-request
url: http://localhost:3001/api/food-items
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Bad Item",
      "category": "Snack",
      "price": -50,
      "isAvailable": "yes"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("TC09: status code is 400", function () { pm.response.to.have.status(400); });
      pm.test("TC09: response is JSON", function () { pm.response.to.be.json; });
      pm.test("TC09: error mentions category, price and isAvailable", function () { const body = pm.response.json(); const t = body.details.join(' '); pm.expect(t).to.include('category'); pm.expect(t).to.include('price'); pm.expect(t).to.include('isAvailable'); });
    language: text/javascript
order: 9000
